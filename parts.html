<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spare Parts Library | Mechanical Library SP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #090d10;
            color: #fff;
        }

        /* ================= HEADER ================= */

        header {
            height: 72px;
            background: #11171c;
            border-bottom: 2px solid #ff6a00;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gear {
            font-size: 34px;
            color: #ff6a00;
            animation: rotate 8s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .logo h1 {
            font-size: 17px;
            line-height: 1.1;
        }

        .logo span {
            color: #ff6a00;
        }

        .back {
            text-decoration: none;
            color: #bbb;
            border: 1px solid #343d43;
            padding: 9px 15px;
            border-radius: 6px;
            font-size: 13px;
        }

        .back:hover {
            color: #ff6a00;
            border-color: #ff6a00;
        }

        /* ================= HERO ================= */

        .hero {
            text-align: center;
            padding: 50px 20px 40px;
            background:
                radial-gradient(
                    circle at center,
                    #202a31 0%,
                    #090d10 65%
                );
        }

        .badge {
            display: inline-block;
            color: #ff6a00;
            border: 1px solid #ff6a00;
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .hero h2 {
            font-size: clamp(30px, 6vw, 52px);
            margin-bottom: 12px;
        }

        .hero h2 span {
            color: #ff6a00;
        }

        .hero p {
            max-width: 720px;
            margin: auto;
            color: #808b92;
            font-size: 14px;
            line-height: 1.7;
        }

        /* ================= SEARCH ================= */

        .search-box {
            max-width: 850px;
            margin: 25px auto 0;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            height: 53px;
            background: #11181d;
            border: 1px solid #3a444a;
            border-radius: 8px;
            outline: none;
            color: #fff;
            padding: 0 18px;
            font-size: 14px;
        }

        .search-box input:focus {
            border-color: #ff6a00;
            box-shadow: 0 0 0 3px rgba(255,106,0,.08);
        }

        .search-btn {
            height: 53px;
            padding: 0 25px;
            border: none;
            border-radius: 8px;
            background: #ff6a00;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #ff7c20;
        }

        /* ================= FILTER ================= */

        .filters {
            max-width: 850px;
            margin: 12px auto 0;
            display: flex;
            gap: 10px;
        }

        .filters select {
            flex: 1;
            height: 42px;
            background: #11181d;
            border: 1px solid #303a40;
            color: #aaa;
            border-radius: 6px;
            padding: 0 10px;
            outline: none;
        }

        .filters select:focus {
            border-color: #ff6a00;
        }

        /* ================= CONTENT ================= */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 38px 20px 65px;
        }

        .section-title {
            margin-bottom: 20px;
        }

        .section-title h3 {
            font-size: 23px;
        }

        .section-title span {
            color: #ff6a00;
        }

        /* ================= PART GRID ================= */

        .parts-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(270px, 1fr));
            gap: 18px;
        }

        .part-card {
            background: #12191e;
            border: 1px solid #293239;
            border-radius: 10px;
            padding: 20px;
            transition: .3s;
        }

        .part-card:hover {
            border-color: #ff6a00;
            transform: translateY(-4px);
        }

        .part-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 15px;
        }

        .part-icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,106,0,.08);
            border: 1px solid rgba(255,106,0,.18);
            border-radius: 9px;
            font-size: 29px;
        }

        .category {
            font-size: 9px;
            color: #909ba1;
            border: 1px solid #414b51;
            padding: 5px 7px;
            border-radius: 4px;
        }

        .part-card h4 {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .part-card > p {
            color: #7d888f;
            font-size: 12px;
            line-height: 1.6;
            min-height: 40px;
        }

        .part-info {
            margin-top: 15px;
            padding-top: 13px;
            border-top: 1px solid #293239;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 11px;
        }

        .info-row span:first-child {
            color: #727e85;
        }

        .info-row span:last-child {
            color: #c0c8cc;
            text-align: right;
        }

        .view-btn {
            width: 100%;
            height: 40px;
            margin-top: 10px;
            background: transparent;
            border: 1px solid #3a454b;
            border-radius: 6px;
            color: #ff6a00;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        .view-btn:hover {
            background: #ff6a00;
            color: #fff;
            border-color: #ff6a00;
        }

        /* ================= NO RESULT ================= */

        #noResult {
            display: none;
            text-align: center;
            padding: 55px 20px;
            color: #727d84;
        }

        #noResult .icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        #noResult h3 {
            color: #ff6a00;
            margin-bottom: 7px;
        }

        /* ================= MODAL ================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.78);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-box {
            width: 100%;
            max-width: 550px;
            background: #12191e;
            border: 1px solid #ff6a00;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-header h3 {
            color: #ff6a00;
            font-size: 20px;
        }

        .close {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 25px;
            cursor: pointer;
        }

        .close:hover {
            color: #ff6a00;
        }

        .modal-content {
            color: #a4adb2;
            font-size: 13px;
            line-height: 1.7;
        }

        .modal-content strong {
            color: #fff;
        }

        .modal-section {
            margin-top: 16px;
            padding-top: 13px;
            border-top: 1px solid #293239;
        }

        /* ================= INFO BOX ================= */

        .info-box {
            margin-top: 40px;
            background: #11181d;
            border: 1px solid #293239;
            border-left: 3px solid #ff6a00;
            border-radius: 8px;
            padding: 20px;
        }

            margin-bottom: 10px;
