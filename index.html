<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.container {
    text-align: center;
    color: white;
}

h1 {
    font-size: 40px;
    margin-bottom: 15px;
}

p {
    font-size: 18px;
    margin-bottom: 25px;
}

button {
    padding: 12px 30px;
    border: none;
    border-radius: 8px;
    background: white;
    color: #667eea;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #eee;
}
</style>
</head>

<body>

<div class="container">
    <h1>Welcome</h1>
    <p>Welcome to my website</p>

    <button onclick="window.location.href='login.html'">
        Login
    </button>
</div>

</body>
</html>
