<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Mechanical Library SP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at center, #202a31 0%, #080b0d 65%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ================= BACKGROUND GEARS ================= */

        .gear {
            position: absolute;
            color: rgba(255, 106, 0, 0.08);
            font-size: 230px;
            animation: rotate 20s linear infinite;
            user-select: none;
        }

        .gear1 {
            left: -80px;
            top: -60px;
        }

        .gear2 {
            right: -90px;
            bottom: -80px;
            font-size: 300px;
            animation-direction: reverse;
        }

        .gear3 {
            right: 12%;
            top: 10%;
            font-size: 100px;
            animation-duration: 10s;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* ================= LOGIN BOX ================= */

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
            position: relative;
            z-index: 5;
        }

        .login-box {
            background: rgba(17, 23, 28, 0.96);
            border: 1px solid #303a40;
            border-top: 3px solid #ff6a00;
            border-radius: 15px;
            padding: 38px 32px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(255, 106, 0, 0.08);
        }

        /* ================= LOGO ================= */

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border: 2px solid #ff6a00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: #ff6a00;
            animation: rotate 8s linear infinite;
            box-shadow: 0 0 25px rgba(255, 106, 0, 0.15);
        }

        .logo h1 {
            font-size: 23px;
            letter-spacing: 1px;
        }

        .logo h1 span {
            color: #ff6a00;
        }

        .logo p {
            color: #7f8a91;
            font-size: 13px;
            margin-top: 7px;
        }

        /* ================= TITLE ================= */

        .login-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-title h2 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .login-title p {
            color: #8c969c;
            font-size: 14px;
        }

        /* ================= INPUT ================= */

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #c8ced2;
            font-size: 14px;
        }

        .input-box {
            position: relative;
        }

        .input-box .icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff6a00;
            font-size: 18px;
        }

        .input-box input {
            width: 100%;
            height: 52px;
            background: #0c1115;
            border: 1px solid #303a40;
            border-radius: 8px;
            outline: none;
            padding: 0 45px;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #ff6a00;
            box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.08);
        }

        .input-box input::placeholder {
            color: #59636a;
        }

        /* ================= PASSWORD SHOW ================= */

        .show-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
            font-size: 17px;
        }

        .show-password:hover {
            color: #ff6a00;
        }

        /* ================= OPTIONS ================= */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 25px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #8d979d;
        }

        .remember input {
            accent-color: #ff6a00;
        }

        .forgot {
            color: #ff6a00;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* ================= LOGIN BUTTON ================= */

        .login-btn {
            width: 100%;
            height: 53px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(
                135deg,
                #ff6a00,
                #ff8500
            );
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(255, 106, 0, 0.18);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255, 106, 0, 0.3);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        /* ================= DIVIDER ================= */

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #59636a;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #293137;
        }

        /* ================= SIGNUP ================= */

        .signup {
            text-align: center;
            color: #7f898f;
            font-size: 14px;
        }

        .signup a {
            color: #ff6a00;
            text-decoration: none;
            font-weight: bold;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        /* ================= BACK HOME ================= */

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #737d83;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home:hover {
            color: #ff6a00;
        }

        /* ================= SECURITY ================= */

        .security {
            margin-top: 25px;
            padding: 11px;
            border-radius: 7px;
            background: rgba(255, 106, 0, 0.05);
            border: 1px solid rgba(255, 106, 0, 0.1);
            text-align: center;
            color: #707a80;
            font-size: 11px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 480px) {

            .login-container {
                padding: 12px;
            }

            .login-box {
                padding: 30px 22px;
            }

            .logo h1 {
                font-size: 20px;
            }

            .login-title h2 {
                font-size: 25px;
            }

            .gear {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>

    <!-- Background Gears -->

    <div class="gear gear1">⚙</div>
    <div class="gear gear2">⚙</div>
    <div class="gear gear3">⚙</div>


    <!-- LOGIN -->

    <div class="login-container">

        <div class="login-box">

            <!-- Logo -->

            <div class="logo">

                <div class="logo-icon">
                    ⚙
                </div>

                <h1>
                    MECHANICAL <span>LIBRARY SP</span>
                </h1>

                <p>
                    Mechanical Knowledge & Technical Library
                </p>

            </div>


            <!-- Login Title -->

            <div class="login-title">

                <h2>Welcome Back</h2>

                <p>
                    Login to access your mechanical library
                </p>

            </div>


            <!-- FORM -->

            <form id="loginForm">

                <!-- User ID -->

                <div class="input-group">

                    <label for="userid">
                        User ID / Email
                    </label>

                    <div class="input-box">

                        <span class="icon">👤</span>

                        <input
                            type="text"
                            id="userid"
                            name="userid"
                            placeholder="Enter your User ID or Email"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span class="icon">🔐</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <span
                            class="show-password"
                            id="togglePassword"
                            title="Show Password"
                        >
                            👁
                        </span>

                    </div>

                </div>


                <!-- Options -->

                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember Me

                    </label>


                    <a href="forgot-password.html" class="forgot">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    ⚙ LOGIN TO LIBRARY
                </button>

            </form>


            <!-- Divider -->

            <div class="divider">
                NEW MEMBER?
            </div>


            <!-- Signup -->

            <div class="signup">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </div>


            <!-- Back Home -->

            <a href="index.html" class="back-home">
                ← Back to Mechanical Library SP
            </a>


            <!-- Security -->

            <div class="security">
                🔒 Your account information is protected
            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        /* Show / Hide Password */

        const password =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");

        togglePassword.addEventListener(
            "click",
            function () {

                if (password.type === "password") {

                    password.type = "text";

                    togglePassword.textContent = "🙈";

                    togglePassword.title =
                        "Hide Password";

                } else {

                    password.type = "password";

                    togglePassword.textContent = "👁";

                    togglePassword.title =
                        "Show Password";
                }

            }
        );


        /* Login Form */

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const userId =
                    document.getElementById("userid").value.trim();

                const userPassword =
                    document.getElementById("password").value.trim();


                if (userId === "" || userPassword === "") {

                    alert(
                        "Please enter User ID and Password."
                    );

                    return;
                }


                /*
                    BACKEND LOGIN
                    ----------------
                    Yahan baad me PHP / Node.js /
                    Firebase / MySQL backend connect hoga.

                    Example:

                    fetch("login.php", {
                        method: "POST",
                        body: new FormData(this)
                    });
                */


                alert(
                    "Login system will be connected with the database next."
                );

            });

    </script>

</body>
</html>
