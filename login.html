<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Mechanical Library SP</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    #202a31 0%,
                    #080b0d 65%
                );

            color: #fff;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px 15px;

            overflow: hidden;

            position: relative;
        }


        /* ================= LANGUAGE SELECTOR ================= */

        .lang-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .goog-te-gadget-simple {
            background-color: #11171c !important;
            border: 1px solid #303a40 !important;
            padding: 6px 10px !important;
            border-radius: 6px !important;
            font-size: 13px !important;
        }

        .goog-te-gadget-simple span {
            color: #ffffff !important;
        }


        .gear {

            position: fixed;

            color: rgba(255, 106, 0, 0.07);

            user-select: none;

            z-index: 0;

            animation:
                rotate 20s linear infinite;
        }


        .gear1 {

            font-size: 280px;

            left: -100px;

            top: -80px;
        }


        .gear2 {

            font-size: 320px;

            right: -120px;

            bottom: -100px;

            animation-direction: reverse;
        }


        .gear3 {

            font-size: 110px;

            right: 15%;

            top: 8%;

            animation-duration: 9s;
        }


        @keyframes rotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        .login-container {

            width: 100%;

            max-width: 500px;

            position: relative;

            z-index: 5;
        }


        .login-box {

            background:
                rgba(17, 23, 28, 0.97);

            border: 1px solid #303a40;

            border-top: 3px solid #ff6a00;

            border-radius: 16px;

            padding: 35px 32px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(255, 106, 0, 0.08);
        }


        .logo {

            text-align: center;

            margin-bottom: 28px;
        }


        .logo-icon {

            width: 70px;

            height: 70px;

            margin:
                0 auto 12px;

            border: 2px solid #ff6a00;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            color: #ff6a00;

            font-size: 40px;

            animation:
                rotate 8s linear infinite;
        }


        .logo h1 {

            font-size: 22px;

            letter-spacing: 1px;
        }


        .logo h1 span {

            color: #ff6a00;
        }


        .logo p {

            color: #9aa4aa;

            font-size: 14px;

            margin-top: 8px;
        }


        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #d7dde0;

            font-size: 14px;
        }


        .password-box {

            position: relative;
        }


        .form-group input {

            width: 100%;

            padding: 14px 15px;

            background: #0c1114;

            border: 1px solid #3a444a;

            border-radius: 8px;

            color: #fff;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }


        .password-box input {

            padding-right: 55px;
        }


        .form-group input:focus {

            border-color: #ff6a00;

            box-shadow:
                0 0 10px
                rgba(255, 106, 0, 0.15);
        }


        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform:
                translateY(-50%);

            background: none;

            border: none;

            color: #9aa4aa;

            cursor: pointer;

            font-size: 13px;
        }


        .show-password:hover {

            color: #ff6a00;
        }


        .forgot {

            text-align: right;

            margin-top: -7px;

            margin-bottom: 20px;
        }


        .forgot a {

            color: #ff6a00;

            text-decoration: none;

            font-size: 13px;
        }


        .login-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #ff6a00;

            color: #fff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .login-btn:hover {

            background: #e85f00;

            transform:
                translateY(-1px);
        }


        .login-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        #message {

            text-align: center;

            margin-top: 18px;

            min-height: 20px;

            font-size: 14px;
        }


        .signup-link {

            text-align: center;

            margin-top: 22px;

            color: #9aa4aa;

            font-size: 14px;
        }


        .signup-link a {

            color: #ff6a00;

            text-decoration: none;

            font-weight: bold;
        }


        .signup-link a:hover {

            text-decoration: underline;
        }


        @media (max-width: 500px) {

            .login-box {

                padding: 30px 20px;
            }

            .gear1,
            .gear2 {

                display: none;
            }

            .lang-container {
                top: 12px;
                right: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- LANGUAGE SELECTOR -->

    <div class="lang-container" id="google_translate_element"></div>


    <div class="gear gear1">⚙</div>

    <div class="gear gear2">⚙</div>

    <div class="gear gear3">⚙</div>


    <div class="login-container">

        <div class="login-box">


            <div class="logo">

                <div class="logo-icon">
                    ⚙
                </div>

                <h1>
                    Mechanical
                    <span>Library SP</span>
                </h1>

                <p>
                    Login to your account
                </p>

            </div>


            <form id="loginForm">


                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter 10 digit mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <div class="forgot">

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    Login
                </button>


            </form>


            <p id="message"></p>


            <div class="signup-link">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </div>


        </div>

    </div>


    <!-- GOOGLE TRANSLATE SCRIPT -->

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'hi,en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>

    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>


    <!-- FIREBASE -->

    <script type="module">


        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {
            getAuth,
            signInWithEmailAndPassword
        }
        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        // Firebase Configuration

        const firebaseConfig = {

            apiKey:
                "AIzaSyAs5uPMjnz801RxS9uYISNnU3IfVjh4tUY",

            authDomain:
                "mechanical-library-sp.firebaseapp.com",

            projectId:
                "mechanical-library-sp",

            storageBucket:
                "mechanical-library-sp.firebasestorage.app",

            messagingSenderId:
                "593105358258",

            appId:
                "1:593105358258:web:a0cb1d7a382cc5fd1068ab",

            measurementId:
                "G-KK5HCBSFX6"

        };


        // Firebase Start

        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        // Elements

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const mobileInput =
            document.getElementById(
                "mobile"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        const showPassword =
            document.getElementById(
                "showPassword"
            );


        // Show / Hide Password

        showPassword.addEventListener(
            "click",
            function() {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    showPassword.textContent =
                        "Hide";

                } else {

                    passwordInput.type =
                        "password";

                    showPassword.textContent =
                        "Show";

                }

            }
        );


        // Login

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const mobile =
                    mobileInput.value.trim();


                const password =
                    passwordInput.value;


                // Mobile validation

                if (
                    !/^[0-9]{10}$/.test(
                        mobile
                    )
                ) {

                    message.style.color =
                        "#ff4d4d";

                    message.textContent =
                        "Please enter a valid 10 digit mobile number.";

                    return;

                }


                message.textContent = "";


                loginButton.disabled =
                    true;


                loginButton.textContent =
                    "Logging in...";


                try {


                    // Internal email format matching signup.html

                    const internalEmail =
                        mobile +
                        "@mechanicallibrary.sp";


                    await signInWithEmailAndPassword(
                        auth,
                        internalEmail,
                        password
                    );


                    message.style.color =
                        "#00d084";


                    message.textContent =
                        "Login successful!";


                    // Home Page

                    setTimeout(
                        function() {

                            window.location.href =
                                "index.html";

                        },
                        800
                    );


                } catch (error) {


                    console.error(error);


                    message.style.color =
                        "#ff4d4d";


                    if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        message.textContent =
                            "Mobile number or password is incorrect.";

                    }

                    else if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        message.textContent =
                            "This mobile number is not registered.";

                    }

                    else if (
                        error.code ===
                        "auth/wrong-password"
                    ) {

                        message.textContent =
                            "Incorrect password.";

                    }

                    else {

                        message.textContent =
                            "Login failed. Please try again.";

                    }

                }


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "Login";

            }
        );

    </script>


</body>

</html>
