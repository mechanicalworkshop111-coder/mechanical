<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Mechanical Library SP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f12;
            color: white;
            padding: 20px;
        }

        .signup-box {
            width: 100%;
            max-width: 420px;
            background: #151c21;
            padding: 35px 30px;
            border-radius: 12px;
            border: 1px solid #252e34;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .gear {
            font-size: 45px;
            color: #ff6a00;
        }

        h1 {
            font-size: 24px;
            margin-top: 8px;
        }

        h1 span {
            color: #ff6a00;
        }

        .subtitle {
            text-align: center;
            color: #929ca3;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #ddd;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #0e1317;
            color: white;
            border: 1px solid #303940;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #ff6a00;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #ff6a00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ff8500;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #929ca3;
        }

        .login-link a {
            color: #ff6a00;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="signup-box">

    <div class="logo">
        <div class="gear">⚙</div>

        <h1>
            MECHANICAL <span>LIBRARY SP</span>
        </h1>
    </div>

    <p class="subtitle">Create your account</p>

    <form id="signupForm">

        <label>Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >

        <label>Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Mobile Number</label>
        <input
            type="tel"
            id="mobile"
            placeholder="Enter 10 digit mobile number"
            maxlength="10"
            pattern="[0-9]{10}"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Create password"
            minlength="6"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div id="message"></div>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>


<!-- Firebase -->
<script type="module">

    import { initializeApp } 
    from "[https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js](https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js)";

    import { getAuth, createUserWithEmailAndPassword }
    from "[https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js](https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js)";

    import { getFirestore, doc, setDoc }
    from "[https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js](https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js)";


    // Firebase Configuration

    const firebaseConfig = {
        apiKey: "AIzaSyAs5uPMjnz801RxS9uYISNnU3IfVjh4tUY",
        authDomain: "mechanical-library-sp.firebaseapp.com",
        projectId: "mechanical-library-sp",
        storageBucket: "mechanical-library-sp.firebasestorage.app",
        messagingSenderId: "593105358258",
        appId: "1:593105358258:web:a0cb1d7a382cc5fd1068ab",
        measurementId: "G-KK5HCBSFX6"
    };


    // Firebase Start

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // Signup Event

    document
        .getElementById("signupForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
            const password = document.getElementById("password").value;

            const message = document.getElementById("message");

            // Mobile validation
            if (!/^[0-9]{10}$/.test(mobile)) {
                message.style.color = "#ff4444";
                message.textContent = "Please enter a valid 10 digit mobile number.";
                return;
            }

            try {

                const userCredential = await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                const user = userCredential.user;

                await setDoc(
                    doc(db, "users", user.uid),
                    {
                        name: name,
                        email: email,
                        mobile: mobile,
                        createdAt: new Date().toISOString()
                    }
                );

                message.style.color = "#00ff88";
                message.textContent = "Account created successfully!";

                setTimeout(function() {
                    window.location.href = "login.html";
                }, 2000);

            } catch (error) {

                console.error(error);
                message.style.color = "#ff4444";

                if (error.code === "auth/email-already-in-use") {
                    message.textContent = "This email is already registered.";
                } else if (error.code === "auth/invalid-email") {
                    message.textContent = "Please enter a valid email address.";
                } else if (error.code === "auth/weak-password") {
                    message.textContent = "Password must be at least 6 characters.";
                } else {
                    message.textContent = "Signup failed: " + error.message;
                }

            }

        });

</script>

</body>
</html>
