<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Mechanical Library SP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #202a31 0%, #080b0d 65%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            overflow-x: hidden;
            position: relative;
        }

        .gear {
            position: fixed;
            color: rgba(255, 106, 0, 0.07);
            user-select: none;
            z-index: 0;
            animation: rotate 20s linear infinite;
        }

        .gear1 {
            font-size: 280px;
            left: -100px;
            top: -80px;
        }

        .gear2 {
            font-size: 320px;
            right: -120px;
            bottom: -100px;
            animation-direction: reverse;
        }

        .gear3 {
            font-size: 110px;
            right: 15%;
            top: 8%;
            animation-duration: 9s;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .signup-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 5;
        }

        .signup-box {
            background: rgba(17, 23, 28, 0.97);
            border: 1px solid #303a40;
            border-top: 3px solid #ff6a00;
            border-radius: 16px;
            padding: 35px 32px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(255, 106, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 12px;
            border: 2px solid #ff6a00;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff6a00;
            font-size: 40px;
            animation: rotate 8s linear infinite;
        }

        .logo h1 {
            font-size: 22px;
            letter-spacing: 1px;
        }

        .logo h1 span {
            color: #ff6a00;
        }

        .logo p {
            color: #9aa4aa;
            font-size: 14px;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #d7dde0;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            background: #0c1114;
            border: 1px solid #3a444a;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #ff6a00;
            box-shadow: 0 0 10px rgba(255, 106, 0, 0.15);
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #ff6a00;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .signup-btn:hover {
            background: #e85f00;
            transform: translateY(-1px);
        }

        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            min-height: 20px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #9aa4aa;
            font-size: 14px;
        }

        .login-link a {
            color: #ff6a00;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .signup-box {
                padding: 30px 20px;
            }

            .gear1,
            .gear2 {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="gear gear1">⚙</div>
    <div class="gear gear2">⚙</div>
    <div class="gear gear3">⚙</div>

    <div class="signup-container">

        <div class="signup-box">

            <div class="logo">

                <div class="logo-icon">⚙</div>

                <h1>
                    Mechanical <span>Library SP</span>
                </h1>

                <p>Create your account</p>

            </div>

            <form id="signupForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="6"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="signup-btn"
                    id="signupButton"
                >
                    Create Account
                </button>

            </form>

            <p id="message"></p>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </div>


    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        const firebaseConfig = {
            apiKey: "AIzaSyAs5uPMjnz801RxS9uYISNnU3IfVjh4tUY",
            authDomain: "mechanical-library-sp.firebaseapp.com",
            projectId: "mechanical-library-sp",
            storageBucket: "mechanical-library-sp.firebasestorage.app",
            messagingSenderId: "593105358258",
            appId: "1:593105358258:web:a0cb1d7a382cc5fd1068ab",
            measurementId: "G-KK5HCBSFX6"
        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        const signupForm = document.getElementById("signupForm");

        const emailInput = document.getElementById("email");

        const passwordInput = document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const message =
            document.getElementById("message");

        const signupButton =
            document.getElementById("signupButton");


        signupForm.addEventListener("submit", async function(event) {

            event.preventDefault();


            const email = emailInput.value.trim();

            const password = passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            message.textContent = "";

            message.style.color = "#ff6a00";


            if (password !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                return;
            }


            if (password.length < 6) {

                message.textContent =
                    "Password must be at least 6 characters.";

                return;
            }


            signupButton.disabled = true;

            signupButton.textContent =
                "Creating Account...";


            try {

                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                message.style.color = "#00d084";

                message.textContent =
                    "Account created successfully!";


                signupForm.reset();


                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 1500);


            } catch (error) {

                console.error(error);


                message.style.color = "#ff4d4d";


                if (error.code ===
                    "auth/email-already-in-use") {

                    message.textContent =
                        "This email is already registered.";

                }

                else if (error.code ===
                    "auth/invalid-email") {

                    message.textContent =
                        "Please enter a valid email.";

                }

                else if (error.code ===
                    "auth/weak-password") {

                    message.textContent =
                        "Password must be at least 6 characters.";

                }

                else {

                    message.textContent =
                        "Signup failed. Please try again.";

                }

            }


            signupButton.disabled = false;

            signupButton.textContent =
                "Create Account";

        });

    </script>

</body>
</html>
